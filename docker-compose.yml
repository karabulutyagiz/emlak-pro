services:
  postgres:
    image: postgres:16
    container_name: emlak-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emlak_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: emlak-pro-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
